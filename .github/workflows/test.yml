name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Smoke-test the CLI
        run: |
          printf '1\n00:00:01,000 --> 00:00:03,000\nHello there.\n' > sample.srt
          node bin/srt-kit.js shift sample.srt 2.5s | grep -q '00:00:03,500'
          node bin/srt-kit.js strip sample.srt | grep -q 'Hello there.'
          node bin/srt-kit.js fix sample.srt > /dev/null
